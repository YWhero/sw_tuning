<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Target mask labeling</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10151c;color:#e5e9ef}*{box-sizing:border-box}body{margin:0;padding:20px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{font-size:22px;margin:0}main{display:grid;grid-template-columns:240px minmax(0,1fr) 320px;gap:16px}.card{background:#1b2430;border:1px solid #334153;border-radius:12px;padding:16px}h2{font-size:15px;margin:0 0 12px}button,input,select{font:inherit;border:1px solid #465970;background:#273546;color:inherit;border-radius:6px;padding:8px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button.primary{background:#386f55}button.active{border-color:#78c6a0}button:hover:not(:disabled){filter:brightness(1.2)}label{display:block;font-size:13px;color:#aebed0;margin:12px 0 6px}input[type=text]{width:100%}.row{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}#episodes{max-height:75vh;overflow:auto}#episodes button{width:100%;margin-bottom:7px;text-align:left;font-size:13px}.stage{overflow:auto;background:#080d13;border-radius:8px;max-height:66vh;text-align:center}canvas{max-width:100%;height:auto;cursor:crosshair}video{width:100%;max-height:240px}#instruction{line-height:1.5;font-weight:500}small,.muted{color:#9dacbd}progress{width:100%;height:14px}#message{white-space:pre-wrap;color:#ffbe85;font-size:13px}#points{max-height:180px;overflow:auto;font-size:12px}.badge{font-size:12px;padding:4px 8px;border-radius:20px;background:#314151}details{margin-top:12px}#instances{width:100%}@media(max-width:1100px){main{grid-template-columns:180px minmax(0,1fr)}aside:last-child{grid-column:1/-1}}
</style>
<header><h1>Target mask labeling</h1><span id="model" class="muted"></span></header>
<main><aside class="card"><h2>Episodes</h2><button id="next">Next unapproved</button><div id="episodes" style="margin-top:12px"></div></aside>
<section class="card"><div class="row"><h2 id="title">Select an episode</h2><span id="status" class="badge"></span></div><p id="instruction"></p>
<div class="stage"><canvas id="canvas"></canvas></div>
<div class="row"><button id="prevFrame">←</button><input id="frame" type="number" min="0" value="0" style="width:90px"><button id="nextFrame">→</button><input id="slider" type="range" min="0" value="0" style="flex:1"><label style="margin:4px"><input id="overlay" type="checkbox" checked> Mask overlay</label></div>
<small>Click + / − points in the original image. Ctrl + wheel zooms. Save seed, generate, review the full video, then approve.</small>
<details open><summary>Review video</summary><video id="review" controls preload="metadata"></video></details>
<details><summary>Original video</summary><video id="original" controls preload="metadata"></video></details>
</section><aside class="card"><h2>Target objects</h2><label>Instruction target class (exclude gripper)</label><input id="target" type="text" placeholder="e.g. coffee can"><div class="row"><button id="newObject">New instance</button><button id="deleteObject">Remove instance</button></div><select id="instances" size="3"></select>
<div class="row"><button id="positive" class="active">+ Include</button><button id="negative">− Exclude</button><button id="undo">Undo point</button></div><div id="points"></div>
<div class="row"><button id="save">Save seed</button><button id="generate" class="primary">Generate masks</button></div><button id="auto" disabled>Automatic target selection</button><p id="automaticReason" class="muted" style="font-size:12px"></p>
<h2 style="margin-top:20px">Review & approval</h2><progress id="progress" value="0" max="1"></progress><p id="stage" class="muted"></p>
<div class="row"><button id="approve" class="primary" disabled>Approve & next</button><button id="erase">Erase component</button></div><label>Erase scope</label><select id="scope"><option value="frame">This frame</option><option value="video">Entire video · tracked, rejects ambiguity</option></select><p id="message"></p>
</aside></main>
<script>
const $=id=>document.getElementById(id);let renderReviewVideo=true;let token, state, episode=null, job={}, objects=[], selected=null, mode=1, erasing=false, image=new Image(), meta={}, zoom=1, dirty=false, requestVersion=0;
async function api(path,value){const res=await fetch(path,value===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Label-Token':token},body:JSON.stringify(value)});const data=await res.json();if(!res.ok)throw Error(data.error);return data}
function message(text){$('message').textContent=text}
async function action(fn){try{message('');await fn()}catch(e){message(e.message)}}
async function refresh(){state=await api('/api/state');$('episodes').replaceChildren();for(const e of state.episodes){const b=document.createElement('button');b.textContent=`Episode ${String(e.episode).padStart(6,'0')} · ${e.status}`;b.classList.toggle('active',e.episode===episode);b.onclick=()=>action(()=>load(e.episode));$('episodes').append(b)}}
async function load(index){if(dirty&&!confirm('Discard unsaved seed changes?'))return;$('review').removeAttribute('src');$('review').dataset.job='';episode=index;requestVersion++;dirty=false;const ep=state.episodes.find(e=>e.episode===index);$('frame').max=$('slider').max=ep.length-1;$('frame').value=$('slider').value=0;const seed=await api(`/api/seed?episode=${episode}`);objects=seed.objects||[];selected=objects[0]?.id||null;if(seed.frame!==undefined)$('frame').value=$('slider').value=seed.frame;$('target').value=objects[0]?.name||'';renderObjects();$('original').src=`/video.mp4?episode=${episode}`;await frame();await poll()}
function renderObjects(){const list=$('instances');list.replaceChildren();for(const o of objects){const option=document.createElement('option');option.value=o.id;option.textContent=`${o.name} #${o.id} · ${o.points.length} points`;option.selected=o.id===selected;list.append(option)}$('points').textContent=(objects.find(o=>o.id===selected)?.points||[]).map((p,i)=>`${objects.find(o=>o.id===selected).labels[i]?'＋':'−'} (${Math.round(p[0])}, ${Math.round(p[1])})`).join(' · ');draw()}
async function frame(){const version=++requestVersion;const f=Number($('frame').value);meta=await api(`/api/frame?episode=${episode}&frame=${f}`);if(version!==requestVersion)return;$('instruction').textContent=meta.instruction;$('title').textContent=`Episode ${String(episode).padStart(6,'0')} · Frame ${f+1}`;const next=new Image();next.onload=()=>{if(version!==requestVersion)return;image=next;draw()};next.src=`/frame.png?episode=${episode}&frame=${f}&overlay=${$('overlay').checked?1:0}&v=${Date.now()}`}
function draw(){if(!image.width)return;const c=$('canvas');c.width=image.width;c.height=image.height;c.style.maxWidth=zoom===1?'100%':'none';c.style.width=`${image.width*zoom}px`;const ctx=c.getContext('2d');ctx.drawImage(image,0,0);for(const o of objects){for(let i=0;i<o.points.length;i++){const [x,y]=o.points[i];ctx.beginPath();ctx.arc(x,y,6,0,2*Math.PI);ctx.fillStyle=o.labels[i]?'#65ef9e':'#ff6a70';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}}}
$('canvas').onclick=e=>action(async()=>{const rect=e.target.getBoundingClientRect();const point=[(e.clientX-rect.left)*image.width/rect.width,(e.clientY-rect.top)*image.height/rect.height];if(erasing){await api('/api/correct',{episode,job_id:job.job_id,frame:Number($('frame').value),point,scope:$('scope').value});erasing=false;$('erase').classList.remove('active');await poll();return}const obj=objects.find(o=>o.id===selected);if(!obj)throw Error('Create a target instance first');obj.points.push(point);obj.labels.push(mode);dirty=true;renderObjects()});
$('canvas').addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();zoom=Math.max(.5,Math.min(5,zoom+(e.deltaY<0?.2:-.2)));draw()}},{passive:false});
$('newObject').onclick=()=>action(async()=>{const name=$('target').value.trim();if(!name)throw Error('Enter the instruction target class');if(objects.some(o=>o.name!==name))throw Error('Baseline uses a single target class; instances must share the class');selected=Math.max(0,...objects.map(o=>o.id))+1;objects.push({id:selected,name,points:[],labels:[]});dirty=true;renderObjects()});
$('deleteObject').onclick=()=>{objects=objects.filter(o=>o.id!==selected);selected=objects[0]?.id||null;dirty=true;renderObjects()};$('instances').onchange=()=>{selected=Number($('instances').value);renderObjects()};
$('positive').onclick=()=>{mode=1;$('positive').classList.add('active');$('negative').classList.remove('active')};$('negative').onclick=()=>{mode=0;$('negative').classList.add('active');$('positive').classList.remove('active')};$('undo').onclick=()=>{const o=objects.find(o=>o.id===selected);if(o){o.points.pop();o.labels.pop();dirty=true;renderObjects()}};
$('save').onclick=()=>action(async()=>{await api('/api/seed',{schema_version:2,episode,camera:state.camera,instruction:meta.instruction,frame:Number($('frame').value),width:meta.width,height:meta.height,objects});dirty=false;await poll();message('Seed saved. Generate masks to review before approval.')});
$('generate').onclick=()=>action(async()=>{if(dirty)throw Error('Save seed changes first');await api('/api/complete',{episode});await poll()});
$('approve').onclick=()=>action(async()=>{if(dirty)throw Error('Save and regenerate changed prompts first');await api('/api/review',{episode,job_id:job.job_id,seed_hash:job.seed_hash});await refresh();if(state.next_episode!==null)await load(state.next_episode);else message('All episodes approved')});
$('erase').onclick=()=>{erasing=!erasing;$('erase').classList.toggle('active',erasing);message(erasing?'Click the connected mask component to erase. This creates a new review revision.':'')};
async function changeFrame(f){if(objects.length&&dirty)throw Error('Save the seed before changing its anchor frame');objects=[];selected=null;$('frame').value=$('slider').value=Math.max(0,Math.min(Number($('frame').max),f));renderObjects();await frame()}
$('prevFrame').onclick=()=>action(()=>changeFrame(Number($('frame').value)-1));$('nextFrame').onclick=()=>action(()=>changeFrame(Number($('frame').value)+1));$('frame').onchange=()=>action(()=>changeFrame(Number($('frame').value)));$('slider').onchange=()=>action(()=>changeFrame(Number($('slider').value)));$('overlay').onchange=()=>action(frame);$('next').onclick=()=>action(async()=>{await refresh();if(state.next_episode!==null)await load(state.next_episode)});
async function poll(){if(episode===null)return;job=await api(`/api/job?episode=${episode}`);$('status').textContent=job.status;const entry=state?.episodes.find(e=>e.episode===episode);if(entry&&entry.status!==job.status){entry.status=job.status;await refresh()}$('progress').max=job.total||1;$('progress').value=job.completed||0;$('stage').textContent=job.error||`${job.stage||job.status} ${job.completed||0}/${job.total||0}`;const running=job.status==='running';$('save').disabled=$('generate').disabled=running;$('approve').disabled=job.status!=='awaiting_review'||dirty;$('erase').disabled=!['approved','awaiting_review'].includes(job.status);if(['approved','awaiting_review'].includes(job.status)&&$('review').dataset.job!==job.job_id){$('review').dataset.job=job.job_id;if(renderReviewVideo)$('review').src=`/review.mp4?episode=${episode}&job=${job.job_id}`;await frame()}}
action(async()=>{const server=await api('/api/server');token=server.token;renderReviewVideo=server.render_review_video!==false;if(!renderReviewVideo){$('review').closest('details').hidden=true;$('approve').hidden=true;document.querySelector('section.card small').textContent='에피소드별 예시 프레임에서 target 포인트 지정 → Save seed. SAM 자동 전파 후 에이전트가 마스크를 검토합니다. 검토용 MP4는 생성하지 않습니다.';}$('model').textContent=server.model;$('automaticReason').textContent=server.automatic_reason;await refresh();if(state.next_episode!==null)await load(state.next_episode);else if(state.episodes.length)await load(state.episodes[0].episode)});setInterval(()=>action(poll),1500);
</script></html>
